name: Desktop Build (Windows & macOS)

# Fotuber Stüdyo masaüstü uygulamasını (desktop/) Windows .exe ve macOS .dmg olarak derler.
# Kod GitHub'a gönderildiğinde otomatik çalışır; ayrıca elle de tetiklenebilir.
# Üretilen kurulum dosyaları "Artifacts" olarak indirilebilir (Actions çalışması sayfasında).

on:
  push:
    branches: [main, master]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:
    inputs:
      app_url:
        description: "Uygulamanın açacağı adres (boş bırakılırsa config.js varsayılanı kullanılır)"
        required: false
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: fotuber-studio-windows
            pattern: |
              desktop/release/*.exe
          - os: macos-latest
            script: dist:mac
            artifact: fotuber-studio-macos
            pattern: |
              desktop/release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: desktop
        run: yarn install --frozen-lockfile

      - name: Build installer
        working-directory: desktop
        # FOTUBER_APP_URL: repo secret'ından ya da elle tetiklemede girilen değerden gelir;
        # boşsa config.js içindeki DEFAULT_APP_URL kullanılır.
        env:
          FOTUBER_APP_URL: ${{ github.event.inputs.app_url != '' && github.event.inputs.app_url || secrets.FOTUBER_APP_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn ${{ matrix.script }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error
          retention-days: 30
